# The system, as it actually is. One file, edited by hand, read by everything.
#
# The agent's SYSTEM prompt is generated from this at startup, the config keys
# that describe hardware or policy are taken from here rather than duplicated
# in config.json, and guard.py asserts its hard limits against it before the
# first tick. config.json keeps only what is secret or per-install: the
# Telegram token, the gateway password, the model endpoint.
#
# Where a number here is measured rather than nameplate it says so. Where the
# repository disagrees with itself, the disagreement is written down rather
# than resolved by guesswork.

site:
  name: Rosarito
  timezone: America/Tijuana
  latitude: 32.36
  longitude: -117.06

network:
  dashboard_url: http://192.168.3.10:8080     # Pi 5, Flask dashboard
  agent_host: 192.168.3.152                   # KAMRUI, this agent
  gateway:
    host: 192.168.3.131                       # Schneider Conext Gateway
    modbus_port: 503
    insightlocal_url: https://192.168.3.131
  vps: 45.32.131.224                          # nginx, Alexa webhook
  esp8266_backup: 192.168.6.72

# Three Schneider inverters on one Modbus segment. The two XW Pros run in
# parallel through a PDP; their AC output calibration is held near-identical
# (Master 32840, Slave 32940) because a large difference between them drives
# circulating current.
inverters:
  - name: xw_pro_master
    model: Schneider XW Pro 6848
    slave: 10
    role: AC output, DC power and charger; paralleled with the slave
  - name: xw_plus_5548
    model: Schneider XW+ 5548
    slave: 11
    role: fed by the Kubota generator
  - name: xw_pro_slave
    model: Schneider XW Pro 6848
    slave: 12
    role: paralleled with the master through the PDP

generators:
  # A generator's learned rate is its GROSS delivery: what went into the pack
  # plus what the house took at the same minute, which is a property of the
  # engine rather than of the evening. At decision time the expected house
  # load for the run window is subtracted to get what will actually reach the
  # pack. assumed_charge_a is the fallback until a generator has runs of its
  # own, and is already a net figure - conservative, allowing for an ordinary
  # house - so it is not netted a second time.
  # Fuel. `curve` is [load_fraction, gal_per_hr] points, interpolated
  # linearly between them and held flat beyond either end; load_fraction may
  # exceed 1.0 and the curve simply stops rising there.
  #
  # The load fraction is computed from gross_w, which is shunt-measured DC
  # delivery - what went into the pack plus what the house took - so it
  # under-reads the generator's AC output by the charger's efficiency, on the
  # order of 8-10%. These curves are therefore effectively in DC-delivered
  # terms rather than in the AC terms their sources are written in. That is a
  # known bias in one direction, and a tank-fill calibration absorbs it: fill,
  # run, fill again, and scale the curve by what the pump says against what
  # this reports.
  mep:
    label: MEP-803A
    ags_slave: 51
    nameplate_kw: 10
    charge_rate_pct: 100
    feeds: [xw_pro_master, xw_pro_slave]
    assumed_charge_a: 140          # net, conservative, ~7.4 kW at 53 V
    exercise: {every_days: 5, at: "09:00", minutes: 30}
    fuel:
      # rated_w is the axis the published points are expressed on, not a
      # capability claim: the owner runs this at 10 kW.
      rated_w: 10000
      # The 1.00 point is published (DoD spec sheet, MEP-803A). The 0.50 point
      # is community-reported and stands in until the TM table or a tank-fill
      # calibration replaces it, so a half-load estimate is softer than a
      # full-load one and should be read that way.
      curve: [[0.50, 0.55], [1.00, 0.99]]
  kubota:
    label: Kubota
    ags_slave: 50
    nameplate_kw: 7
    charge_rate_pct: 70
    feeds: [xw_plus_5548]
    assumed_charge_a: 80           # net, conservative, ~4.2 kW at 53 V
    exercise: {every_days: 3, at: "09:00", minutes: 30}
    fuel:
      rated_w: 7000
      # Published: Power Technology CD-7 operator's manual, Kubota D905-B.
      curve: [[0.25, 0.16], [0.50, 0.32], [0.75, 0.51], [1.00, 0.64]]
    # The Kubota's runs also drive a Magnum MS4048 inverter/charger that is
    # not on Modbus. Nothing the Schneider units report includes what the
    # Magnum is doing, so anything summed from their registers understates a
    # Kubota run. Gross is measured at the shunt and at the inverters' load
    # output, so it counts whatever the Magnum put in without seeing it.
    # The 70% charge-rate cap exists because of this parallel charger.
    magnum: {model: Magnum MS4048, on_modbus: false}
  max_run:
    pi5_minutes: 120               # the dashboard's own cap per run
    ags_hours: 3                   # the AGS cap, whichever binds first

battery:
  # Three chemistries on a common DC bus, 15S, two BMS units with active
  # balancers - so 10-15 mV cell deltas are normal and not a fault.
  chemistry: LG NMC, Tesla 18650 modules, Chevy Bolt LG cells
  configuration: 15S
  capacity_kwh_nominal: 96         # ~1790 Ah at 53.6 V
  capacity_ah_nominal: 1790
  # The agent does not use the nominal figure to plan. It learns the pack's
  # real capacity from the monitor's own Ah-remaining against SOC.
  capacity_learned_from: Conext Battery Monitor, Ah remaining vs SOC

  # --- what health.py computes from ------------------------------------------
  #
  # nominal_ah is the figure the cycle count is expressed against. It differs
  # from capacity_ah_nominal above by ten amp-hours; the two came from
  # different reckonings of the same pack and the disagreement is recorded
  # rather than resolved by picking one. Nothing turns on the difference: it
  # is half a percent of a cycle count that is itself an estimate.
  nominal_ah: 1800
  chemistry_short: NMC 15S
  # Second-life cells: they arrived with a history nobody here measured, so
  # every cycle count below is cycles *since this pack was built*, and the
  # calendar clock started before that.
  second_life: true
  # Measured by tank... by discharge: the energy the pack gave up walking
  # from 59.5 V down to 52.0 V. est_total_kwh extrapolates that span to the
  # whole curve and is the softer of the two by a long way.
  measured_kwh_59_5_to_52_0: 40.9
  est_total_kwh: 83
  # The battery room, year round. Not instrumented - there is no temperature
  # anywhere on Modbus - so this is the owner's figure for a room that is
  # kept, not a reading.
  ambient_f: 78
  climate_controlled: true

  # The Battery Monitor's state of charge is not a scale anything should be
  # quoted from. It is one shunt's integration against a capacity derived
  # from the same shunt, so it cannot check itself, and on this pack it has
  # read 100% at 56.2 V and 98% at 55.6 V - voltages three quarters of a volt
  # apart cannot both be full. The read tools do not return it at all; what
  # the pack holds is answered in watt-hours between two voltages, and how it
  # is ageing by the battery_health tool.
  soc_scale_unreliable: true

  # Parametric NMC fade. Coefficients, not measurements: they come from the
  # published literature on NMC cells and are here to be argued with and
  # replaced, which is why every one of them is named and commented rather
  # than buried in code.
  aging:
    # Capacity lost per equivalent full cycle at 100% depth of discharge.
    # 0.02%/EFC is 20% at 1000 full cycles, the round figure most NMC cycle
    # studies land near for a 25 C, moderate-rate cell.
    cycle_fade_pct_per_efc_at_full_dod: 0.02
    # Fade per *cycle* scales as DoD^n. Cycle-life studies fit lithium-ion
    # cycles-to-failure as DoD^-n with n around 1.5 to 2.5 for NMC, and fade
    # per cycle is the reciprocal of that, so n is the same number.
    #
    # The direction matters more than the value and is easy to get backwards.
    # An equivalent full cycle taken in shallow bites contains 1/DoD actual
    # cycles, so fade per EFC goes as DoD^(n-1): above 1 it falls as the
    # cycling gets shallower, which is the shallow-is-gentler result the
    # literature reports. n below 1 inverts it and says shallow cycling is
    # worse per unit of throughput, which is not what the cells do. At 1.5
    # and this pack's 21% mean depth an EFC costs 0.46 of a full-depth one.
    cycle_dod_exponent: 1.5
    # Calendar fade at the reference point: 25 C (77 F) at mid state of
    # charge, per year, on a square-root-of-time curve linearised to the
    # first decade. 2%/yr is mid-range for NMC.
    calendar_fade_pct_per_year_ref: 2.0
    calendar_ref_temp_f: 77
    # Arrhenius activation energy in eV. 0.5 eV is the usual NMC value and
    # means roughly a doubling of calendar fade per 10 C.
    calendar_activation_ev: 0.5
    # Calendar fade rises with resting state of charge. Expressed against the
    # fraction of the *measured* 52.0-59.5 V span the pack rests at, because
    # this pack has no state-of-charge scale worth using: see
    # soc_scale_unreliable. 50% is the reference; each point above or below
    # moves calendar fade by this much of itself.
    calendar_band_reference_pct: 50
    calendar_band_sensitivity_per_pct: 0.012
    # What counts as worn out.
    end_of_life_capacity_pct: 80
  floor_v: 52.0                    # never start below this
  ceiling_v: 57.0                  # never stop above this
  full_v: 61.0                     # what full would be; deliberately not a target
  policy: >
    Held mid-curve on purpose, between about 52 and 57 V, for longevity.
    Charging to full is never the goal.
  monitor:
    model: Conext Battery Monitor
    slave: 191
    measures: [voltage, current, state of charge, amp-hours remaining,
               minutes to discharge]
    note: >
      Positive current is charging. The monitor publishes no temperature and
      no energy counters; battery in and out are derived by summing the XW
      units' own counters.

# 52 panels, 225 W each, 11.7 kW nominal, across three controllers.
#
# The slave-to-model mapping below is the verified one from
# docs/energy_registers.md, where each slave was read with both MPPT register
# tables and the wrong table gave an impossible answer. The README's own array
# table disagrees with it about which slave is the MPPT 80, and its panel
# counts do not match the measured output ratios either, so the physical
# array behind each controller is recorded as unverified rather than guessed.
arrays:
  totals:
    panels: 52
    panel_watts: 225
    nominal_kw: 11.7
  controllers:
  - name: mppt80
    slave: 170
    controller: Schneider MPPT 80 600
    data_key: mppt80PVPower
    observed_peak_w: 2084          # highest seen in the stored samples
    physical: unverified - the README places the generator building roof here
  - name: south
    slave: 31
    controller: Schneider MPPT 60 150
    data_key: southArrayPVPower
    observed_peak_w: 1497
    physical: unverified - the README places the house south and west hips here
  - name: west
    slave: 30
    controller: Schneider MPPT 60 150
    data_key: westArrayPVPower
    observed_peak_w: 2092
    physical: unverified - the README places the ground array and terrace here

# What the agent is allowed to do with its one lever. guard.py holds
# floor_v and ceiling_v as code constants and checks them against
# battery.floor_v and battery.ceiling_v at startup; the rest is read here.
policy:
  default_start: 52.0
  default_stop: 56.0
  start_voltage_min: 52.0
  start_voltage_max: 56.0
  stop_voltage_min: 54.5
  stop_voltage_max: 57.0
  min_stop_minus_start: 2.0
  solo_peak_threshold: 57.0
  solo_target: 57.0
  solo_target_floor: 55.0
  storm_cloud_pct: 70
  clear_cloud_pct: 30
  predawn_hours: 3.0            # tuned on the live system; was 2.0
  topup_earliest: "21:00"       # quoted: unquoted YAML reads 21:00 as 1260
  topup_margin_pct: 15
  min_topup_wh: 6000
  topup_bands: {kubota: 8000, mep: 15000}
